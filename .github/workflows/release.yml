name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build plugin
        run: npm run build

      - name: Package plugin zip
        run: |
          mkdir -p release/ob-code-preview
          cp main.js manifest.json styles.css release/ob-code-preview/
          cd release && zip -r ob-code-preview.zip ob-code-preview/
          ls -lh ob-code-preview.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ob-code-preview.zip
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
